<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        .menu {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .menu button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        .logout {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: red;
            color: white;
        }

      .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
        }

     .cards .card {
    margin-top: 0;
        }

     .cards .card:last-child {
    grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Dashboard</h2>
    </div>

    <div class="content">

        <h1>Halo 👋</h1>
        <p>Selamat datang di dashboard.</p>

        <div class="card">
            <h3>Informasi</h3>
            <p>Kamu berhasil login!</p>
        </div>

        <div class="menu">
            <button onclick="home()">Home</button>
            <button onclick="profile()">Profile</button>
        </div>

        <button class="logout" onclick="logout()">Logout</button>

    </div>
  <div class="cards">

    <div class="card">
        <h3>👤 User</h3>
        <p id="ujer"></p>
    </div>

    <div class="card">
        <h3>🟢 Status</h3>
        <p>Online</p>
    </div>

    <div class="card">
        <h3>🔐 Login</h3>
        <p>Berhasil</p>
    </div>

  </div>

  <script>
    let username = localStorage.getItem("username");
    document.getElementById("namaUser").textContent = username;
document.getElementById("ujer").textContent = username;
    function home() {
      window.location.href = "#"
    }
    function profile() {
      window.location.href = "profile.html"
    }
    function logout() {
      localStorage.removeItem("username")
      window.location.href = "start.html";
    }
    
  </script>
</body>
</html>
